<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil del candidato – SIDOVI</title>

    <link rel="stylesheet" href="css/perfil.css">
    
</head>

<body>

<header class="site-header">

    <div class="header-inner">

        <div class="brand">
            <img
                    src="img/logo_sidovi.png"
                    alt="Logo SIDOVI"
                    class="brand-logo"
            >
        </div>

        <nav>
            <ul class="nav-list">

                <li>
                    <a href="RRHH.html" class="nav-link">
                        Panel
                    </a>
                </li>

                <li>
                    <a href="login.html" class="nav-link nav-cta">
                        Cerrar Sesión
                    </a>
                </li>

            </ul>
        </nav>

        <button
                class="menu-toggle"
                id="menuToggle"
        >
            ☰
        </button>

    </div>

</header>


<main class="panel-layout">

    <aside class="sidebar">

    <span class="sidebar-title">
      Candidato
    </span>

        <a
                class="sidebar-link"
                href="postulantes.html"
        >
            ← Postulantes
        </a>

        <a
                class="sidebar-link"
                href="hojasdevida.html"
        >
            📄 Hojas de Vida
        </a>

    </aside>


    <section class="panel-content">

        <div class="panel-header">

            <h1>
                Perfil del candidato
            </h1>

            <p>
                Información registrada durante la postulación.
            </p>

        </div>


        <div
                id="perfilEstado"
                class="form-alert"
        >
            Cargando perfil...
        </div>


        <article
                id="perfilCard"
                class="profile-card"
                hidden
        ></article>


        <!-- ================================================= -->
        <!-- REPORTE DE RRHH -->
        <!-- ================================================= -->

        <section
                id="reporteRrhhSection"
                class="data-table-wrap sidovi-inline-1"
               
                hidden
        >

            <divclass="sidovi-inline-3">

                <h2class="sidovi-inline-4">
                    📝 Reporte de Recursos Humanos
                </h2>

                <pclass="sidovi-inline-5">
                    Registra el concepto de RRHH sobre la hoja de vida
                    antes de que el candidato pase a entrevista gerencial.
                </p>


                <div
                        id="reporteAlert"
                        class="form-alert"
                        hidden
                ></div>


                <form id="reporteRrhhForm">


                    <div class="field">

                        <label for="concepto">
                            Concepto sobre la hoja de vida
                        </label>

                        <textarea
                                id="concepto"
                                rows="5"
                                placeholder="Escribe el concepto general de Recursos Humanos sobre el candidato..."
                                required
                        ></textarea>

                    </div>


                    <div class="field">

                        <label for="fortalezas">
                            Fortalezas
                        </label>

                        <textarea
                                id="fortalezas"
                                rows="4"
                                placeholder="Indica las principales fortalezas encontradas en la hoja de vida..."
                        ></textarea>

                    </div>


                    <div class="field">

                        <label for="aspectosConsiderar">
                            Aspectos a considerar
                        </label>

                        <textarea
                                id="aspectosConsiderar"
                                rows="4"
                                placeholder="Indica aspectos que Gerencia debería tener en cuenta durante la entrevista..."
                        ></textarea>

                    </div>


                    <div class="field">

                        <label for="recomendacion">
                            Recomendación de RRHH
                        </label>

                        <textarea
                                id="recomendacion"
                                rows="4"
                                placeholder="Escribe la recomendación de Recursos Humanos..."
                        ></textarea>

                    </div>


                    <div
                            class="form-actions sidovi-inline-2"
                           
                    >

                        <button
                                type="submit"
                                class="btn btn-primary"
                                id="btnGuardarReporte"
                        >
                            Guardar reporte
                        </button>

                    </div>

                </form>

            </div>

        </section>


    </section>

</main>


<script src="js/perfil.js"></script>

</body>

</html>
