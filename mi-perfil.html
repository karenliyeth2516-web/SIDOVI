<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi perfil – SIDOVI</title><link rel="stylesheet" href="css/estilos.css"><link rel="stylesheet" href="css/perfiles.css"></head><body><header class="site-header"><div class="header-inner"><div class="brand"><img src="img/logo_sidovi.png" class="brand-logo" alt="SIDOVI"></div><nav><ul class="nav-list"><li><a href="RRHH.html" id="volverPanel" class="nav-link">Volver al panel</a></li><li><a href="login.html" class="nav-link nav-cta">Cerrar Sesión</a></li></ul></nav><button class="menu-toggle" id="menuToggle">☰</button></div></header><main class="panel-content profile-editor"><div class="panel-header"><h1>Mi perfil</h1><p>Actualiza tus datos y la foto que aparecerá en la bienvenida.</p></div><div id="perfilAlert" class="form-alert" hidden></div><div class="profile-card"><form id="perfilForm"><div class="field"><label for="nombreCompleto">Nombre completo</label><input id="nombreCompleto" required></div><div class="profile-grid"><div class="field"><label for="tipoDocumento">Tipo de documento</label><select id="tipoDocumento"><option>CC</option><option>CE</option><option>PASAPORTE</option></select></div><div class="field"><label for="numeroDocumento">Número de documento</label><input id="numeroDocumento"></div><div class="field"><label for="telefono">Teléfono</label><input id="telefono"></div><div class="field"><label for="direccion">Dirección</label><input id="direccion"></div><div class="field"><label for="cargo">Cargo</label><input id="cargo" placeholder="Gerente / Recursos Humanos"></div></div><div class="field"><label for="fotoPerfil">Foto de perfil</label><input id="fotoPerfil" type="file" accept="image/jpeg,image/png,image/webp"><small>Máximo 5 MB.</small></div><div id="fotoVista"></div><button class="btn btn-primary" type="submit">Guardar perfil</button></form></div></main><script src="js/mi-perfil.js"></script></body></html>
